AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  NT548 Lab2 - Cau 2 - CI/CD cho CloudFormation: CodeCommit -> CodeBuild
  (cfn-lint + package) -> CodeBuild (taskcat) -> [Manual approval] ->
  CloudFormation deploy (nested stacks ha tang Lab 1).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Ma nguon (CodeCommit)" }
        Parameters: [CreateRepository, RepositoryName, BranchName]
      - Label: { default: "Pipeline" }
        Parameters: [InfraStackName, EnableTaskcat, EnableManualApproval]

Parameters:
  CreateRepository:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Tao moi CodeCommit repository (false = dung repo co san cung ten)
  RepositoryName:
    Type: String
    Default: nt548-lab2
    AllowedPattern: '^[\w.-]{1,100}$'
  BranchName:
    Type: String
    Default: main
  InfraStackName:
    Type: String
    Default: nt548-lab2-cfn-infra
    Description: Ten stack ha tang Lab 1 ma pipeline se tao/cap nhat
    AllowedPattern: '^[a-zA-Z][-a-zA-Z0-9]{2,40}$'
  EnableTaskcat:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Chay taskcat (deploy that de test, ~10-15 phut, ton phi NAT Gateway)
  EnableManualApproval:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Them buoc duyet tay truoc khi deploy

Conditions:
  ShouldCreateRepo: !Equals [!Ref CreateRepository, "true"]
  UseTaskcat: !Equals [!Ref EnableTaskcat, "true"]
  UseApproval: !Equals [!Ref EnableManualApproval, "true"]

Resources:
  # ---------------------------------------------------------------------------
  # Source repository
  # ---------------------------------------------------------------------------
  Repository:
    Type: AWS::CodeCommit::Repository
    Condition: ShouldCreateRepo
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref RepositoryName
      RepositoryDescription: NT548 Lab 2 - ma nguon IaC (CloudFormation)

  # ---------------------------------------------------------------------------
  # Artifact bucket: artifact pipeline + nested templates theo tung commit
  # ---------------------------------------------------------------------------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-artifacts-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub ${ArtifactBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------------------------------------------------------------------------
  # IAM roles
  # ---------------------------------------------------------------------------
  CodeBuildLintRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: lint-and-package
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:DeleteObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*
              - Sid: Reports
                Effect: Allow
                Action: [codebuild:CreateReportGroup, codebuild:CreateReport, codebuild:UpdateReport, codebuild:BatchPutTestCases]
                Resource: !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/*
              - Sid: ValidateTemplate
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*"

  CodeBuildTaskcatRole:
    Type: AWS::IAM::Role
    Condition: UseTaskcat
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: taskcat-e2e-test
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*
              - Sid: PipelineArtifacts
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub ${ArtifactBucket.Arn}/*
              - Sid: TaskcatBuckets
                Effect: Allow
                Action: ["s3:*"]
                Resource:
                  - arn:aws:s3:::tcat-*
                  - arn:aws:s3:::tcat-*/*
              - Sid: ListBuckets
                Effect: Allow
                Action: [s3:ListAllMyBuckets, s3:GetBucketLocation]
                Resource: "*"
              - Sid: DeployTestStacks
                Effect: Allow
                Action: ["cloudformation:*", "ec2:*", "ssm:GetParameter", "ssm:GetParameters", "sts:GetCallerIdentity"]
                Resource: "*"
              - Sid: IamForTestStacks
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:PassRole
                # Ten role do CloudFormation tu sinh theo ten stack taskcat (tCaT-...)
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/tCaT-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/tCaT-*

  CloudFormationDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: deploy-lab1-infra
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: NestedStacks
                Effect: Allow
                Action: ["cloudformation:*"]
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${InfraStackName}*
              - Sid: Lab1Resources
                Effect: Allow
                Action: ["ec2:*", "ssm:GetParameters", "ssm:GetParameter"]
                Resource: "*"
              - Sid: ReadNestedTemplates
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub ${ArtifactBucket.Arn}/*
              - Sid: Ec2InstanceRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:PassRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${InfraStackName}*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/${InfraStackName}*

  # Nested stack: CloudFormation dung lai CHINH role nay de tao stack con,
  # nen role phai duoc phep iam:PassRole cho chinh no (tach thanh policy rieng
  # de tranh tham chieu vong toi GetAtt cua chinh role).
  CloudFormationDeployRolePassSelf:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref CloudFormationDeployRole
      PolicyName: pass-self-for-nested-stacks
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt CloudFormationDeployRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketVersioning, s3:ListBucket]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*
              - Sid: Source
                Effect: Allow
                Action:
                  - codecommit:GetBranch
                  - codecommit:GetCommit
                  - codecommit:GetRepository
                  - codecommit:UploadArchive
                  - codecommit:GetUploadArchiveStatus
                  - codecommit:CancelUploadArchive
                Resource: !Sub arn:${AWS::Partition}:codecommit:${AWS::Region}:${AWS::AccountId}:${RepositoryName}
              - Sid: Build
                Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AWS::StackName}-*
              - Sid: Deploy
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:SetStackPolicy
                  - cloudformation:ValidateTemplate
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${InfraStackName}/*
              - Sid: PassDeployRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationDeployRole.Arn

  # ---------------------------------------------------------------------------
  # CodeBuild projects
  # ---------------------------------------------------------------------------
  LintProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AWS::StackName}-cfn-lint
      Description: cfn-lint + validate-template + upload nested templates
      ServiceRole: !GetAtt CodeBuildLintRole.Arn
      TimeoutInMinutes: 15
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: cau2-cloudformation/buildspecs/lint-package.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: TEMPLATES_BUCKET
            Value: !Ref ArtifactBucket
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED

  TaskcatProject:
    Type: AWS::CodeBuild::Project
    Condition: UseTaskcat
    Properties:
      Name: !Sub ${AWS::StackName}-taskcat
      Description: Taskcat - kiem thu trien khai that cac template
      ServiceRole: !GetAtt CodeBuildTaskcatRole.Arn
      TimeoutInMinutes: 60
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: cau2-cloudformation/buildspecs/taskcat.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED

  # ---------------------------------------------------------------------------
  # CodePipeline (V2)
  # ---------------------------------------------------------------------------
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${AWS::StackName}
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: CodeCommit
              Namespace: SourceVariables
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: "1"
              Configuration:
                RepositoryName: !Ref RepositoryName
                BranchName: !Ref BranchName
                PollForSourceChanges: false
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput

        - Name: Validate
          Actions:
            - Name: cfn-lint-and-package
              RunOrder: 1
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref LintProject
                EnvironmentVariables: '[{"name":"COMMIT_ID","value":"#{SourceVariables.CommitId}","type":"PLAINTEXT"}]'
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
            - !If
              - UseTaskcat
              - Name: taskcat-test
                RunOrder: 2
                ActionTypeId:
                  Category: Test
                  Owner: AWS
                  Provider: CodeBuild
                  Version: "1"
                Configuration:
                  ProjectName: !Ref TaskcatProject
                InputArtifacts:
                  - Name: SourceOutput
                OutputArtifacts:
                  - Name: TaskcatReport
              - !Ref AWS::NoValue

        - !If
          - UseApproval
          - Name: Approve
            Actions:
              - Name: ManualApproval
                ActionTypeId:
                  Category: Approval
                  Owner: AWS
                  Provider: Manual
                  Version: "1"
                Configuration:
                  CustomData: "Kiem tra ket qua cfn-lint/taskcat truoc khi deploy ha tang Lab 1"
          - !Ref AWS::NoValue

        - Name: Deploy
          Actions:
            - Name: deploy-lab1-infra
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref InfraStackName
                TemplatePath: BuildOutput::main.yaml
                TemplateConfiguration: BuildOutput::prod-config.json
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn: !GetAtt CloudFormationDeployRole.Arn
                OutputFileName: stack-outputs.json
              InputArtifacts:
                - Name: BuildOutput
              OutputArtifacts:
                - Name: DeployOutput

  # ---------------------------------------------------------------------------
  # EventBridge: tu dong chay pipeline khi push len branch
  # ---------------------------------------------------------------------------
  PipelineTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}

  PipelineTriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Chay pipeline khi co commit moi tren CodeCommit branch
      EventPattern:
        source: [aws.codecommit]
        detail-type: [CodeCommit Repository State Change]
        resources:
          - !Sub arn:${AWS::Partition}:codecommit:${AWS::Region}:${AWS::AccountId}:${RepositoryName}
        detail:
          event: [referenceCreated, referenceUpdated]
          referenceType: [branch]
          referenceName: [!Ref BranchName]
      Targets:
        - Id: codepipeline
          Arn: !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}
          RoleArn: !GetAtt PipelineTriggerRole.Arn

Outputs:
  RepositoryCloneUrlHttp:
    Description: URL clone CodeCommit (HTTPS / git-remote-codecommit)
    Value: !Sub https://git-codecommit.${AWS::Region}.amazonaws.com/v1/repos/${RepositoryName}
  RepositoryGrcUrl:
    Description: URL dung voi git-remote-codecommit
    Value: !Sub codecommit::${AWS::Region}://${RepositoryName}
  PipelineName:
    Value: !Ref Pipeline
  PipelineConsoleUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  InfraStackName:
    Value: !Ref InfraStackName
