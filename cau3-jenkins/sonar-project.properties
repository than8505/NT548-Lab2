# SonarQube - phân tích toàn bộ monorepo microservices (chạy từ thư mục cau3-jenkins)
sonar.projectKey=nt548-lab2-aurapan
sonar.projectName=NT548 Lab2 - Aurapan microservices
sonar.sourceEncoding=UTF-8

# Mã nguồn các service
sonar.sources=app/client,app/user,app/product,app/order,app/payment,app/expiration
sonar.exclusions=**/node_modules/**,**/coverage/**,**/reports/**,**/.next/**,\
  app/client/public/**,**/__test__/**,**/__mocks__/**,**/test/**,**/*.test.ts,**/*.test.js

# Mã kiểm thử (Jest)
sonar.tests=app/user/src,app/product/src,app/order/src,app/payment/src
sonar.test.inclusions=**/__test__/**,**/*.test.ts,**/test/**

# Độ phủ kiểm thử (sinh bởi jest --coverage ở stage "Unit test")
sonar.javascript.lcov.reportPaths=app/user/coverage/lcov.info,app/product/coverage/lcov.info,\
  app/order/coverage/lcov.info,app/payment/coverage/lcov.info
sonar.typescript.tsconfigPaths=app/user/tsconfig.json,app/product/tsconfig.json,\
  app/order/tsconfig.json,app/payment/tsconfig.json,app/expiration/tsconfig.json

# Không tính file khởi động/hạ tầng vào độ phủ
sonar.coverage.exclusions=**/index.ts,**/NatsWrapper.ts,**/stripe.ts,app/client/**,app/expiration/**

# Kết quả kiểm thử dạng JUnit đã hiển thị trên Jenkins; Sonar chỉ cần coverage
sonar.scm.provider=git
