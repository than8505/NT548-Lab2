# NATS Streaming (event bus giữa các service) + Redis (hàng đợi của expiration)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-depl
  labels: { app: nats, tier: messaging }
spec:
  replicas: 1
  selector:
    matchLabels: { app: nats }
  template:
    metadata:
      labels: { app: nats, tier: messaging }
    spec:
      containers:
        - name: nats
          image: nats-streaming:0.25.6
          args: ["-p", "4222", "-m", "8222", "-hbi", "5s", "-hbt", "5s", "-hbf", "2", "-SD", "-cid", "aurapan"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /streaming/serverz, port: 8222 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nats-srv
spec:
  selector: { app: nats }
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
    - { name: monitoring, port: 8222, targetPort: 8222 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expiration-redis-depl
  labels: { app: expiration-redis, tier: database }
spec:
  replicas: 1
  selector:
    matchLabels: { app: expiration-redis }
  template:
    metadata:
      labels: { app: expiration-redis, tier: database }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            tcpSocket: { port: 6379 }
---
apiVersion: v1
kind: Service
metadata:
  name: expiration-redis-srv
spec:
  selector: { app: expiration-redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
