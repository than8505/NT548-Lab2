# MongoDB riêng cho từng service (database-per-service pattern)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-mongo-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path   # provisioner mặc định của k3s
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-mongo-depl
  labels:
    app: user-mongo
    tier: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: user-mongo
  template:
    metadata:
      labels:
        app: user-mongo
        tier: database
    spec:
      containers:
        - name: mongo
          image: mongo:6.0
          ports:
            - containerPort: 27017
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: user-mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: user-mongo-srv
spec:
  selector:
    app: user-mongo
  ports:
    - name: db
      port: 27017
      targetPort: 27017
---
