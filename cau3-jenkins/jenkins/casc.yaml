# Jenkins Configuration as Code (JCasC)
# Các biến ${...} được lấy từ biến môi trường (file .env qua docker compose)
jenkins:
  systemMessage: "NT548 Lab 2 - Câu 3: CI/CD microservices Aurapan (Jenkins + SonarQube + Trivy + k3s)"
  numExecutors: 4
  mode: NORMAL
  labelString: "built-in docker"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: true
  globalNodeProperties:
    - envVars:
        env:
          - key: DOCKERHUB_NAMESPACE
            value: "${DOCKERHUB_USER}"
          - key: K3S_HOST
            value: "${K3S_HOST}"
          - key: SONAR_NETWORK
            value: "lab2-net"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: dockerhub
              description: "Docker Hub (push image)"
              username: "${DOCKERHUB_USER}"
              password: "${DOCKERHUB_TOKEN}"
          - string:
              scope: GLOBAL
              id: sonarqube-token
              description: "SonarQube token cho Jenkins"
              secret: "${SONAR_TOKEN}"
          - file:
              scope: GLOBAL
              id: k3s-kubeconfig
              description: "Kubeconfig của ServiceAccount jenkins-deployer (namespace aurapan)"
              fileName: kubeconfig
              secretBytes: "${readFileBase64:/run/secrets/kubeconfig}"
          - string:
              scope: GLOBAL
              id: app-jwt-key
              description: "JWT_KEY cho các microservice"
              secret: "${JWT_KEY}"

unclassified:
  location:
    url: "${JENKINS_URL}"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: sonarqube-token

# Tạo sẵn job pipeline trỏ tới Jenkinsfile trong repo
jobs:
  - script: |
      pipelineJob('aurapan-microservices') {
        description('NT548 Lab2 - Câu 3: build, test, SonarQube, Trivy, deploy k3s')
        logRotator { numToKeep(20) }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${LAB_REPO_URL}') }
                branch('*/${LAB_REPO_BRANCH}')
              }
            }
            scriptPath('cau3-jenkins/Jenkinsfile')
            lightweight(true)
          }
        }
      }
